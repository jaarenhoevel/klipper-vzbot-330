[gcode_macro SET_VELOCITY_LIMIT]
rename_existing: SET_VELOCITY_LIMIT_BASE
variable_factor: 1.0

gcode:
    {% set f = printer["gcode_macro SET_VELOCITY_LIMIT"].factor|float %}

    {% set cmd = "SET_VELOCITY_LIMIT_BASE" %}

    {% if 'ACCEL' in params %}
        {% set cmd = cmd + " ACCEL=" ~ (params.ACCEL|float * f) %}
    {% endif %}
    {% if 'ACCEL_TO_DECEL' in params %}
        {% set cmd = cmd + " ACCEL_TO_DECEL=" ~ (params.ACCEL_TO_DECEL|float * f) %}
    {% endif %}
    {% if 'VELOCITY' in params %}
        {% set cmd = cmd + " VELOCITY=" ~ params.VELOCITY %}
    {% endif %}
    {% if 'SQUARE_CORNER_VELOCITY' in params %}
        {% set cmd = cmd + " SQUARE_CORNER_VELOCITY=" ~ params.SQUARE_CORNER_VELOCITY %}
    {% endif %}
    {% if 'MINIMUM_CRUISE_RATIO' in params %}
        {% set cmd = cmd + " MINIMUM_CRUISE_RATIO=" ~ params.MINIMUM_CRUISE_RATIO %}
    {% endif %}

    {cmd}

[gcode_macro SET_ACCEL_FACTOR]
gcode:
    {% set input_f = params.FACTOR|float %}
    {% set f = [4.0, [0.1, input_f]|max]|min %}

    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=factor VALUE={f}
    RESPOND MSG="Accel factor set to {f} (requested {input_f})"

[gcode_macro RESET_ACCEL]
gcode:
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}